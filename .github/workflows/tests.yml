name: FocusFix tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test recording, break timing and notification permissions
        run: bash scripts/test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test account deletion with fake authentication and storage
        run: node --test supabase/tests/*.test.mjs
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix supabase --ignore-scripts --no-package-lock
      - name: Test private groups, streak freezes and research access in PostgreSQL
        run: npm --prefix supabase run test:database
