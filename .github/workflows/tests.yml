name: FocusFix tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test recording, break timing and notification permissions
        run: bash scripts/test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test upload authorization, quotas and receipts with synthetic data
        run: node --test upload-service/tests/*.test.mjs
